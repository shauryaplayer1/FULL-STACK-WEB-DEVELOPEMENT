<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Async Users Fetch — JSONPlaceholder</title>
  <style>
    :root{font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;line-height:1.4}
    body{padding:28px;background:#f6f8fa;color:#0b1220}
    h1{font-size:20px;margin:0 0 18px}
    .card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 6px 18px rgba(11,18,32,0.06);max-width:920px}
    .controls{display:flex;gap:12px;align-items:center;margin-bottom:12px}
    button{background:#0b72ff;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef2f6}
    th{font-weight:600;font-size:13px;color:#243447}
    .muted{color:#65707a;font-size:13px}
    .spinner{width:18px;height:18px;border-radius:50%;border:3px solid rgba(0,0,0,0.08);border-top-color:#0b72ff;animation:spin 1s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    .status{display:flex;gap:10px;align-items:center}
    .error{color:#b00020;font-weight:600}
    .center{display:flex;align-items:center;justify-content:center;padding:20px}
    .empty{padding:14px;color:#475569}
  </style>
</head>
<body>
  <div class="card">
    <h1>Users (async / await + DOM)</h1>
    <div class="controls">
      <div class="status">
        <div id="spinner" aria-hidden="true" style="display:none" class="spinner"></div>
        <div id="statusText" class="muted">Ready</div>
      </div>

      <div style="flex:1"></div>

      <button id="refreshBtn">Refresh</button>
    </div>

    <div style="overflow:auto">
      <table aria-live="polite" id="usersTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>City</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="empty"><td colspan="3">No data loaded yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Single-file example that fetches users using async/await from JSONPlaceholder
    // Endpoint: https://jsonplaceholder.typicode.com/users

    const API_URL = 'https://jsonplaceholder.typicode.com/users';
    const spinner = document.getElementById('spinner');
    const statusText = document.getElementById('statusText');
    const refreshBtn = document.getElementById('refreshBtn');
    const tableBody = document.getElementById('tableBody');

    // Show/hide loading spinner and update status text
    function setLoading(isLoading) {
      if (isLoading) {
        spinner.style.display = 'inline-block';
        statusText.textContent = 'Loading...';
        refreshBtn.disabled = true;
      } else {
        spinner.style.display = 'none';
        statusText.textContent = 'Loaded';
        refreshBtn.disabled = false;
      }
    }

    // Render users array into the table body
    function renderUsers(users) {
      tableBody.innerHTML = '';
      if (!Array.isArray(users) || users.length === 0) {
        tableBody.innerHTML = '<tr class="empty"><td colspan="3">No users available.</td></tr>';
        return;
      }

      const fragment = document.createDocumentFragment();
      users.forEach(user => {
        const tr = document.createElement('tr');
        const nameTd = document.createElement('td');
        const emailTd = document.createElement('td');
        const cityTd = document.createElement('td');

        nameTd.textContent = user.name || '';
        emailTd.textContent = user.email || '';
        cityTd.textContent = (user.address && user.address.city) || '';

        tr.appendChild(nameTd);
        tr.appendChild(emailTd);
        tr.appendChild(cityTd);
        fragment.appendChild(tr);
      });

      tableBody.appendChild(fragment);
    }

    // Fetch users with async/await and basic error handling
    async function fetchUsers() {
      try {
        setLoading(true);
        // Intentional small delay to show spinner on fast networks (remove if you want)
        // await new Promise(res => setTimeout(res, 200));

        const res = await fetch(API_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
        const users = await res.json();

        renderUsers(users);
        statusText.textContent = `Loaded ${users.length} users`;
      } catch (err) {
        console.error('Fetch failed', err);
        tableBody.innerHTML = `<tr class="empty"><td colspan="3" class="error">Failed to load users: ${err.message}</td></tr>`;
        statusText.textContent = 'Error';
      } finally {
        setLoading(false);
      }
    }

    // Wire up button
    refreshBtn.addEventListener('click', () => fetchUsers());

    // Fetch on initial load
    window.addEventListener('DOMContentLoaded', () => fetchUsers());
  </script>
</body>
</html>
